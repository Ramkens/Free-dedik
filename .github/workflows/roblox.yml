name: roblox-kasm-desktop

on: [push, workflow_dispatch]

jobs:
  roblox:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download & Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz
          ./ngrok config add-authtoken 2OSMjN5cvDadPGM3YbUY4EmB9Ln_6HX7XaTGoq5rsJvVCMYJN

      - name: Run Kasm Desktop Container
        run: |
          docker run -d \
            --name kasm-desktop \
            --privileged \
            -p 6901:6901 \
            -e VNC_PW=Burmalda09090 \
            kasmweb/desktop:1.14.0

          sleep 15

      - name: Install Sober and Place Auto-Farm Scripts
        run: |
          docker exec -u root kasm-desktop bash -c "
            rm -f /etc/apt/sources.list.d/google-chrome.list && \
            apt-get update && \
            apt-get install -y flatpak xdotool && \
            flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo && \
            flatpak install -y flathub org.vinegarhq.Sober || true && \
            
            mkdir -p /home/kasm-default-profile/Desktop && \
            
            echo -e '#!/bin/bash\necho Anti-AFK started!\nwhile true; do sleep 120; xdotool key space; done' > /home/kasm-default-profile/Desktop/anti_afk.sh && \
            echo -e '#!/bin/bash\necho Autoclicker started!\nwhile true; do xdotool click 1; sleep 0.5; done' > /home/kasm-default-profile/Desktop/autoclicker.sh && \
            
            chmod +x /home/kasm-default-profile/Desktop/*.sh && \
            chown -R kasm-default-profile:kasm-default-profile /home/kasm-default-profile/Desktop
          "

      - name: Start Ngrok Tunnel
        run: |
          ./ngrok http https://localhost:6901 --verify-upstream-tls=false
          
