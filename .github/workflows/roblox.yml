name: roblox-android

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Download & Setup Ngrok
      run: |
        curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz
        ./ngrok config add-authtoken 2OSMjN5cvDadPGM3YbUY4EmB9Ln_6HX7XaTGoq5rsJvVCMYJN

    - name: Enable KVM / Kernel Modules
      run: |
        sudo apt-get update
        sudo apt-get install -y cpu-checker qemu-kvm
        sudo usermod -aG kvm $USER
        sudo chmod 666 /dev/kvm || true

    - name: Run Android Container with Web UI
      run: |
        docker run -d \
          --name android-container \
          --privileged \
          --memory=6g \
          --cpus=2.00 \
          -p 6080:6080 \
          -e DEVICE="Samsung Galaxy S6" \
          budtmo/docker-android-x86-9.0

    - name: Wait for Android Boot
      run: |
        echo "Ждем 30 секунд запуска системы..."
        sleep 30

    - name: Start Ngrok Tunnel
      run: |
        echo "=== ССЫЛКА ПОЯВИТСЯ В ВКЛАДКЕ ENDPOINTS В NGROK ==="
        ./ngrok http 6080
