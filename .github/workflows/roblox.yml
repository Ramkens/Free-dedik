name: roblox-android

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Download & Setup Ngrok
      run: |
        curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz
        ./ngrok config add-authtoken 2OSMjN5cvDadPGM3YbUY4EmB9Ln_6HX7XaTGoq5rsJvVCMYJN

    - name: Run Web Desktop (Ubuntu + VNC)
      run: |
        docker run -d \
          --name desktop \
          --privileged \
          --memory=6g \
          --cpus=2.00 \
          -p 6080:80 \
          dorowu/ubuntu-desktop-lxde-vnc:latest

    - name: Wait for Desktop Ready
      run: sleep 10

    - name: Start Ngrok Tunnel
      run: |
        echo "=== ССЫЛКА ПОЯВИТСЯ В NGROK ENDPOINTS ==="
        ./ngrok http 6080
