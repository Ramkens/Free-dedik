name: roblox-kasm-desktop

on: [push, workflow_dispatch]

jobs:
  roblox:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download & Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz
          ./ngrok config add-authtoken 2OSMjN5cvDadPGM3YbUY4EmB9Ln_6HX7XaTGoq5rsJvVCMYJN

      - name: Run Kasm Desktop Container
        run: |
          docker run -d \
            --name kasm-desktop \
            --privileged \
            -p 6901:6901 \
            -e VNC_PW=Burmalda09090 \
            kasmweb/desktop:1.14.0

          sleep 15

      - name: Install Tools and Setup Auto-Farm Scripts
        run: |
          docker exec -u root kasm-desktop bash -c "
            rm -f /etc/apt/sources.list.d/google-chrome.list && \
            apt-get update && \
            apt-get install -y xdotool wget && \
            
            # Находим домашнюю директорию юзера Kasm
            KASM_DIR=\$(eval echo ~kasm_user)
            DESKTOP_DIR=\"\$KASM_DIR/Desktop\"
            mkdir -p \"\$DESKTOP_DIR\"
            
            # Anti-AFK (Пробел раз в 2 минуты)
            echo '#!/bin/bash' > \"\$DESKTOP_DIR/anti_afk.sh\"
            echo 'echo Anti-AFK started!' >> \"\$DESKTOP_DIR/anti_afk.sh\"
            echo 'while true; do sleep 120; xdotool key space; done' >> \"\$DESKTOP_DIR/anti_afk.sh\"
            
            # Автокликер (Клик 1 раз в 0.5 сек)
            echo '#!/bin/bash' > \"\$DESKTOP_DIR/autoclicker.sh\"
            echo 'echo Autoclicker started!' >> \"\$DESKTOP_DIR/autoclicker.sh\"
            echo 'while true; do xdotool click 1; sleep 0.5; done' >> \"\$DESKTOP_DIR/autoclicker.sh\"
            
            # Выставляем права для пользователя kasm_user
            chmod +x \"\$DESKTOP_DIR\"/*.sh
            chown -R kasm_user:kasm_user \"\$DESKTOP_DIR\"
          "

      - name: Start Ngrok Tunnel
        run: |
          ./ngrok http https://localhost:6901 --verify-upstream-tls=false
          
