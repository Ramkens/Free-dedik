name: roblox-android

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Download & Setup Ngrok
      run: |
        curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz
        ./ngrok config add-authtoken 2OSMjN5cvDadPGM3YbUY4EmB9Ln_6HX7XaTGoq5rsJvVCMYJN

    - name: Enable Kernel Modules for Android
      run: |
        sudo apt-get update
        sudo apt-get install -y linux-modules-extra-$(uname -r)
        sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
        sudo modprobe ashmem_linux || true

    - name: Run Android (ReDroid) with CPU Rendering & Web UI
      run: |
        docker run -d \
          --name android-container \
          --privileged \
          --memory=6g \
          --cpus=4 \
          -p 6080:6080 \
          budtmo/docker-android:emulator_11.0

    - name: Start Ngrok Tunnel
      run: |
        echo "=== ТВОЯ ССЫЛКА ДЛЯ ПОДКЛЮЧЕНИЯ ПОВИТ В ЛОГАХ НИЖЕ ==="
        ./ngrok http 6080
