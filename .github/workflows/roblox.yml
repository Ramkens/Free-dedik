name: roblox-kasm-desktop

on: [push, workflow_dispatch]

jobs:
  roblox:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download & Setup Ngrok
        run: |
          curl -s https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz
          ./ngrok config add-authtoken 2OSMjN5cvDadPGM3YbUY4EmB9Ln_6HX7XaTGoq5rsJvVCMYJN

      - name: Run Kasm Desktop Container
        run: |
          docker run -d \
            --name kasm-desktop \
            --privileged \
            -p 6901:6901 \
            -e VNC_PW=Burmalda09090 \
            kasmweb/desktop:1.14.0

          sleep 15

      - name: Install Sober and Place Auto-Farm Scripts
        run: |
          docker exec -u root kasm-desktop bash -c "
            rm -f /etc/apt/sources.list.d/google-chrome.list && \
            apt-get update && \
            apt-get install -y flatpak xdotool && \
            flatpak install -y --from https://sober.roblox.com/sober.flatpakref && \
            
            DESKTOP_DIR=/home/kasm-default-profile/Desktop && \
            mkdir -p \$DESKTOP_DIR && \
            
            # Anti-AFK Скрипт (Нажимает Пробел раз в 2 минуты через xdotool)
            cat << 'EOF' > \$DESKTOP_DIR/anti_afk.sh
          #!/bin/bash
          echo 'Anti-AFK запущен! Нажимает Пробел каждые 120 сек.'
          while true; do
              sleep 120
              xdotool key space
          done
          EOF

            # Автокликер (Кликает левой кнопкой мыши раз в 0.5 сек)
            cat << 'EOF' > \$DESKTOP_DIR/autoclicker.sh
          #!/bin/bash
          echo 'Автокликер запущен!'
          while true; do
              xdotool click 1
              sleep 0.5
          done
          EOF

            chmod +x \$DESKTOP_DIR/anti_afk.sh \$DESKTOP_DIR/autoclicker.sh && \
            chown -R kasm-default-profile:kasm-default-profile \$DESKTOP_DIR
          "

      - name: Start Ngrok Tunnel
        run: |
          ./ngrok http https://localhost:6901 --verify-upstream-tls=false
          
